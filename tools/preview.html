<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fazenda viewer — prévia de interface</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080a08;color:#e4e8dd;font:14px system-ui}main{height:100vh;display:grid;place-items:center;text-align:center;background:radial-gradient(ellipse at 50% 45%,#222b1d,#080a08 65%)}.preview-label{position:fixed;bottom:24px;left:24px;color:#a9b39c;font-size:12px;z-index:2147483646}.scene h1{font-size:32px;font-weight:600;letter-spacing:-1px;margin:0 0 8px}.scene p{color:#bbc4ad}.dialog{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#151815;padding:32px;text-align:center;border:1px solid #363a32;border-radius:12px;max-width:420px;width:calc(100% - 48px);z-index:2147483646}.dialog p{color:#b6bfae}.dialog button{padding:12px 24px;border:0;border-radius:8px;background:#b5c5a1;color:#192014}.dialog[hidden]{display:none}
</style><main data-testid="video-player"><video hidden aria-hidden="true"></video><div class="scene"><h1>Seu sinal. Seu jeito de assistir.</h1><p>Atalhos para seis câmeras e um mosaico sempre por perto.</p></div></main><div class="preview-label">Prévia de interface · sem transmissão ao vivo</div><div id="native-error" class="dialog" hidden><h2>Erro de Reprodução</h2><p>Você não tem permissão para assistir a este conteúdo.</p><button onclick="this.parentElement.hidden=true">Ok</button></div>
<script src="../viewer-ui.js"></script><script src="../toolbar.js"></script><script src="../transition.js"></script><script>
const previewParams = new URL(location.href).searchParams;
const role = previewParams.get('role') === 'mosaic' ? 'mosaic' : 'main';
let viewerState={managed:true,role,visible:false,presentation:'side',preparing:false};
let stateHandler;
history.replaceState(null,'',new URL(FazendaViewer.urls[role==='mosaic'?6:0]).pathname);
let preferenceHandler;
const preferenceKeys=['keyboardShortcutsEnabled','toolbarAutoHide'];
window.chrome={storage:{local:{async get(defaults){const values={...defaults};for(const key of preferenceKeys){const saved=localStorage.getItem(key);if(saved!==null)values[key]=saved==='true';}return values;},async set(values){const changes={};for(const [key,value] of Object.entries(values)){const saved=localStorage.getItem(key);changes[key]={oldValue:saved===null?undefined:saved==='true',newValue:value};localStorage.setItem(key,String(value));}preferenceHandler?.(changes,'local');}},onChanged:{addListener(fn){preferenceHandler=fn;}}},runtime:{getURL:path=>'/'+path,onMessage:{addListener(fn){stateHandler=fn;}},async sendMessage(message){
  if(message.type==='state')return viewerState;
  if(message.type==='select'){
    const path=new URL(FazendaViewer.urls[message.signal-1]).pathname;
    if(location.pathname===path)return {ok:true,changed:false};
    history.replaceState(null,'',path);
    const error=document.getElementById('native-error');error.hidden=false;
    if(!previewParams.has('persistent-error'))setTimeout(()=>{error.hidden=true;},900);
    return {ok:true};
  }
  if(message.type==='toggle'){viewerState={...viewerState,visible:!viewerState.visible,presentation:'side',preparing:false};stateHandler({type:'viewer-state',...viewerState},{},()=>{});return viewerState;}
  if(message.type==='floating'){viewerState={...viewerState,visible:!viewerState.visible,presentation:'pip',preparing:!viewerState.visible};stateHandler({type:'viewer-state',...viewerState},{},()=>{});return viewerState;}
  return {ok:true};
}}};
</script><script src="/content.js"></script></html>
